[project]
name = "sleepkit"
version = "1.0.0a1"
description = "AI driven sleep monitoring kit for ultra low-power wearables."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "Ambiq AI", email = "support.aitg@ambiq.com" },
]
requires-python = ">=3.12,<3.14"

dependencies = [
  "numpy>=2.1,<3",
]

[project.optional-dependencies]
train = [
  "tensorflow>=2.21,<2.22",
  "keras>=3.15.1,<4",
  "h5py>=3.14,<3.15",
]
features = ["physiokit>=0.11,<0.12", "scipy>=1.15,<2"]
datasets = ["pyedflib>=0.1.42", "pandas>=2.3,<3", "pyarrow>=19"]
runtime = ["ai-edge-litert>=2.2,<3"]
hf = ["huggingface-hub>=1,<2"]
reports = ["matplotlib>=3.10,<4", "plotly>=6,<8", "scikit-learn>=1.7,<2"]
tracking = ["wandb>=0.17,<1", "tensorboard>=2.20,<3"]
evb = ["pyserial>=3.5,<4"]
legacy = [
  "sleepkit[train,features,datasets,reports,tracking,evb]",
  "helia-edge>=0.6.2,<0.7",
  "wfdb>=4.1,<5",
  "tqdm>=4.66,<5",
  "seaborn>=0.13,<1",
  "pydantic>=2.12,<3",
  "rich>=13.7",
  "boto3>=1.34,<2",
  "orjson>=3.9,<4",
  "requests>=2.32,<3",
  "argdantic[all]>=1,<2",
  "kaggle>=1.7,<2",
]

[project.scripts]
sleepkit = "sleepkit.recipes:main"
sleepkit-legacy = "sleepkit.cli:main"

[dependency-groups]
dev = [
  "ipython>=8.21.0,<9.0",
  "pytest>=8,<10",
  "taskipy>=1.12.0,<2.0",
  "pre-commit>=3.6.0,<4.0",
  "notebook>=7.0.2,<8.0",

  "pydot>=2.0.0,<3.0",
  "ruff>=0.5.1,<1.0",
]
docs = [
  "mkdocs>=1.5.3,<2.0",
  "mkdocs-material>=9.5.8,<10.0",
  "mkdocstrings-python>=1.8.0,<2.0",
  "markdown-include>=0.8.1,<1.0",
  "mkdocs-exclude>=1.0.2,<2.0",
  "mkdocs-jupyter>=0.24.8,<1.0",
  "mkdocs-gen-files>=0.5.0,<1.0",
  "mkdocs-section-index>=0.3.9,<1.0",
  "mkdocs-literate-nav>=0.6.1,<1.0",
  "black>=24.8.0,<25.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# packages = ["sleepkit"]
include-package-data = true

[tool.setuptools.package-data]
"sleepkit" = ["assets/**/*"]

[tool.setuptools.packages.find]
where  = ["."]
include = ["sleepkit*"]

[tool.taskipy.tasks]
format = "ruff format"
lint = "ruff check"
test = "pytest tests/"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Call to deprecated create:DeprecationWarning",
  "ignore:distutils Version:DeprecationWarning",
  "ignore:The register_cmap function:PendingDeprecationWarning",
]

[tool.ruff]
line-length = 120
extend-exclude = [
  "sleepkit/backends/GenericDataOperations_EvbToPc",
  "sleepkit/backends/GenericDataOperations_PcToEvb",
  "sleepkit/backends/erpc",
]

[tool.ruff.lint]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyright]
reportShadowedImports = "none"

[tool.uv]
package = true
