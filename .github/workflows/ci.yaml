name: sleepKIT CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  PYTHON_VERSION: '3.12'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Python 🐍
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies 🔧
        run: |
          uv sync --locked --extra detection --extra source-audit
          uv run --locked --extra detection --extra source-audit ruff check
          SLEEPKIT_REQUIRE_DETECTION=1 SLEEPKIT_REQUIRE_SOURCE_AUDIT=1 uv run --locked --extra detection --extra source-audit pytest -vv tests/
