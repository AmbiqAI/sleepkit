name: sleepKIT CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync pytest tests/

  train-export-runtime:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ''
      TF_CPP_MIN_LOG_LEVEL: '3'
      TF_NUM_INTEROP_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --extra train --extra runtime --extra hf --extra datasets
      - run: uv run --no-sync pytest tests/test_preprocessing_v1.py tests/test_v1_export.py tests/test_readers_v1.py
